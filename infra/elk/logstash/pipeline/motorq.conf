input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["audit-log", "alerts"]
    group_id => "logstash-consumer"
    codec => json
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    add_field => { "platform" => "motorq" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "motorq-%{[topic]}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
