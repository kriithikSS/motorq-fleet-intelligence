
#  Motorq Connected Vehicle Intelligence Platform
#  One-command startup: docker compose up -d
# ──────────────────────────────────────────────

networks:
  motorq-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:
  qdrant_data:
  grafana_data:
  prometheus_data:

services:

  # ── Zookeeper (Kafka dependency) ──────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: motorq-zookeeper
    networks: [motorq-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka ──────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: motorq-kafka
    networks: [motorq-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 30s

  # ── Kafka Schema Registry ─────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: motorq-schema-registry
    networks: [motorq-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ── Kafka UI ──────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: motorq-kafka-ui
    networks: [motorq-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: motorq
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ── PostgreSQL + TimescaleDB ──────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: motorq-postgres
    networks: [motorq-net]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: motorq
      POSTGRES_USER: ${POSTGRES_USER:-motorq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motorq_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api-gateway/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorq -d motorq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ───────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: motorq-mongo
    networks: [motorq-net]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-motorq}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-motorq_secret}
      MONGO_INITDB_DATABASE: telemetry
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: motorq-redis
    networks: [motorq-net]
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-motorq_secret} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-motorq_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch ─────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: motorq-elasticsearch
    networks: [motorq-net]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kibana ────────────────────────────────────
  kibana:
    image: kibana:8.13.0
    container_name: motorq-kibana
    networks: [motorq-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  # ── Qdrant (Vector Store) ─────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: motorq-qdrant
    networks: [motorq-net]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: motorq-prometheus
    networks: [motorq-net]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  # ── Grafana ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: motorq-grafana
    networks: [motorq-net]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  # ── EMQX MQTT Broker ──────────────────────────
  emqx:
    image: emqx/emqx:5.6.0
    container_name: motorq-emqx
    networks: [motorq-net]
    ports:
      - "1883:1883"     # MQTT
      - "8083:8083"     # WS
      - "18083:18083"   # Dashboard
    environment:
      EMQX_NAME: motorq-emqx
      EMQX_HOST: 127.0.0.1
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka Topic Init ──────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: motorq-kafka-init
    networks: [motorq-net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-telemetry --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ml-events --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic audit-log --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic dlq-events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic driver-scores --partitions 6 --replication-factor 1
      echo 'Kafka topics created!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: "no"
